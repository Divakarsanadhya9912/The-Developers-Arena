global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "churn-prediction-api"
    static_configs:
      - targets: ["churn-api:8000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

# Alerting thresholds (paired with Alertmanager in a fuller production
# setup — included here to document the operational SLOs this service
# targets):
#   - churn_avg_latency_ms > 250        → page on-call
#   - churn_errors_total increasing     → investigate model/API health
#   - no scrape success for 2 minutes   → service down
