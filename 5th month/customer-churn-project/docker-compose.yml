version: "3.9"

# ──────────────────────────────────────────────────────────────────────
# Multi-container stack:
#   churn-api   → FastAPI inference service
#   prometheus  → scrapes /metrics for time-series monitoring
#   grafana     → dashboards on top of Prometheus data
# ──────────────────────────────────────────────────────────────────────

services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-prediction-api:latest
    container_name: churn-api
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - churn-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: churn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - churn-api
    restart: unless-stopped
    networks:
      - churn-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: churn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deployment/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - churn-net

networks:
  churn-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
